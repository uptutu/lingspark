id: G301
version: 3
name: 跨文档说法矛盾
pass: 3
kind: judge
severity: error
scope: claim_pair
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这两条声明是否相互矛盾——按字面理解，它们不可能同时成立？
    例如数值或日期不同、一个说做另一个说不做、一个说必须另一个说不需要、同一个概念给了两种不同的定义口径。
    同一个指标写了两个不同的目标值，也算矛盾，不管哪条写在前面：目标值不是"做到就算满足"的门槛，两个数字只能有一个是对的。
  criteria:
    "true": 两条声明讲的是同一件事，按字面不可能同时成立
    "false": 两条可以同时成立，或者讲的根本不是同一件事
what: 同一件事在两处（通常是两篇文档）的说法互相冲突，读者不知道该信哪个
not_for:
  - 一条是现状，另一条是目标或计划
  - 适用于不同的时间段、版本或阶段（比如本期和下期）
  - 一条是总体规则，另一条是明确写出的例外或细化
  - 讲的是不同对象（不同端、不同角色、不同地区、不同品类）
  - 一条是举例或假设，另一条是正式规定，而且两者并不冲突
  - 只是详略不同，详细的那条没有推翻简略的那条
  - 两处用不同的名字指同一个对象（中文名和代码里的英文名、全称和简称），说的其实是同一回事

message: 同一件事在两处的说法互相矛盾
suggestion: 确认哪一处是对的，把另一处改成一致；如果两处都对，写清楚各自适用的条件。

examples:
  positive:
    - state: "【声明 1】（需求文档.md 第 12 行，主题：退款审核方式）所有退款申请都需要客服人工审核后才能退款。\n【声明 2】（技术方案.md 第 40 行，主题：退款审批流程）50 元以下的退款申请由系统自动通过，不经人工审核。"
      note: 需求说全部人工审核，技术方案里有自动通过
    - state: "【声明 1】（需求文档.md 第 8 行，主题：上线日期）会员积分改版计划于 11 月 15 日上线。\n【声明 2】（周报.md 第 5 行，主题：积分改版上线时间）积分改版定于 12 月 1 日上线。"
      note: 同一个上线日期写了两个
    - state: "【声明 1】（需求文档.md 第 30 行，主题：本期范围）本期不做积分兑换实物礼品。\n【声明 2】（技术方案.md 第 55 行，主题：积分兑换接口）本期新增积分兑换实物礼品的库存扣减接口。"
      note: 需求说不做，技术方案在做
    - state: "【声明 1】（需求文档.md 第 15 行，主题：日活跃用户口径）日活跃用户指当日至少完成一次下单的去重用户。\n【声明 2】（数据报告.md 第 3 行，主题：日活统计口径）日活跃用户按当日打开过 App 的去重用户统计。"
      note: 同一个指标两种口径
    - state: "【声明 1】（需求文档.md 第 22 行，主题：工单响应时限）工单首次响应时间要求不超过 30 分钟。\n【声明 2】（客服运营方案.md 第 18 行，主题：工单首次响应时限）工单首次响应时限为 2 小时。"
      note: 同一个时限两个数
    - state: "【声明 1】（技术方案.md 第 60 行，主题：消息推送方案）消息推送统一使用自建推送服务。\n【声明 2】（汇报.md 第 9 行，主题：推送服务选型）消息推送改为接入第三方推送平台，不再自建。"
      note: 同一个技术决定两种说法
    - state: "【声明 1】（方案.md 第 5 行，主题：核销率目标）核销率目标是 35%。\n【声明 2】（需求.md 第 5 行，主题：核销率目标）核销率提升到 40%。"
      note: 同一个指标两个目标值，目标写在前面也算（实测时漏报过）
  negative:
    - state: "【声明 1】（需求文档.md 第 12 行，主题：退款审核方式）除 50 元以下的小额退款外，退款申请都需要客服人工审核。\n【声明 2】（技术方案.md 第 40 行，主题：退款审批流程）50 元以下的退款申请由系统自动通过。"
      note: 例外已经在总规则里写明
    - state: "【声明 1】（需求文档.md 第 5 行，主题：工单首次响应时间）目前工单平均首次响应时间为 4 小时。\n【声明 2】（汇报.md 第 12 行，主题：工单响应目标）目标是把工单首次响应时间降到 30 分钟以内。"
      note: 一个是现状，一个是目标
    - state: "【声明 1】（需求文档.md 第 20 行，主题：支付方式）本期只支持支付宝和微信支付。\n【声明 2】（路线图.md 第 7 行，主题：支付方式规划）下一期接入银行卡支付。"
      note: 不同阶段
    - state: "【声明 1】（需求文档.md 第 33 行，主题：订单列表排序）商家端的订单列表默认按下单时间倒序排列。\n【声明 2】（技术方案.md 第 71 行，主题：订单列表展示）买家端的订单列表默认按订单状态分组展示。"
      note: 不同的端
    - state: "【声明 1】（需求文档.md 第 26 行，主题：积分有效期）积分有效期为 12 个月。\n【声明 2】（技术方案.md 第 88 行，主题：积分过期处理）积分自获得之日起满 12 个月后过期，每日凌晨批量清理。"
      note: 详略不同，并不冲突
    - state: "【声明 1】（需求文档.md 第 40 行，主题：审批层级）报销审批最多三级。\n【声明 2】（流程设计.md 第 14 行，主题：大额报销审批）报销金额超过 5000 元时增加财务总监审批，合计三级。"
      note: 细化，仍在上限之内
