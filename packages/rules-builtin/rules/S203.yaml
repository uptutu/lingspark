id: S203
version: 1
name: 翻译腔、欧化句式
pass: 2
kind: judge
severity: warning
scope: block
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这段中文是否有明显的翻译腔或欧化句式，读起来不像母语者自然写出的中文？
    典型表现：滥用"进行""作出""予以"加名词；"一个……的过程"；"被……所……"；
    长串定语堆在名词前面；"对于……来说""基于……的"层层套叠；把英文从句结构硬搬进中文。
  criteria:
    "true": 有两处以上这类表达，或者有一处严重到明显影响阅读
    "false": 读起来是自然的中文
what: 翻译腔、欧化句式，读起来不像母语者写的
not_for:
  - 行业里约定俗成的术语和固定说法，比如技术文档里的"进行灰度发布"，单独一处不算
  - 引用的英文原文、代码或专有名词
  - 只有一处轻微的书面化表达，整体读起来自然

message: 这段有翻译腔或欧化句式，读起来不像自然的中文
suggestion: 去掉"进行""作出""被……所"等多余成分，把长定语拆成短句。

examples:
  positive:
    - state: 我们将会对用户的搜索行为进行一个全面的分析，以便于作出更加合理的决策。
      note: 进行一个……分析、作出决策
    - state: 该方案是一个能够被运营人员所理解和使用的、基于规则引擎的、支持多维度配置的推荐系统。
      note: 定语堆叠加被……所
    - state: 对于用户来说，一个更快的退款体验是他们所期望的。
      note: 英文句式硬搬
    - state: 在作者的投稿被系统所审核通过之后，推荐的过程将会被自动地触发。
      note: 连续被动
    - state: 我们需要对这个问题予以高度的重视，并对相关的流程进行必要的优化和调整。
      note: 予以、进行
  negative:
    - state: 我们会分析用户的搜索行为，据此调整排序规则。
      note: 自然
    - state: 新系统基于规则引擎，运营人员可以按城市、品类、会员等级配置推荐规则。
      note: 一处"基于"是正常用法
    - state: 用户希望退款更快：提交申请后 10 分钟内收到结果。
      note: 自然
    - state: 作者的投稿通过审核后，系统自动开始推荐。
      note: 自然
    - state: 本次上线采用灰度发布，先覆盖 10% 的商家，观察一周后全量。
      note: 术语
