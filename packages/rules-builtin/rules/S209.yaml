id: S209
version: 1
name: 章节内容与标题不符
pass: 2
kind: judge
severity: warning
scope: section
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这个章节的内容是否和标题不符：标题说的是一件事，内容主要在讲另一件事，
    或者内容几乎没有涉及标题说的主题？
  criteria:
    "true": 内容的主体和标题说的主题对不上
    "false": 内容的主体就是标题说的主题
what: 章节内容和标题不符
not_for:
  - 内容涵盖了标题的主题，同时顺带提到一些相关事项
  - 标题是概括性的，比如"其他""附录""补充说明"
  - 章节很短，只是一两句过渡

message: 这一节的内容和标题不符
suggestion: 改标题，或者把内容挪到合适的章节。

examples:
  positive:
    - state: "【章节标题】三、风险与应对\n【章节内容】新流程分三步：用户提交工单，系统自动分派，客服确认受理。分派规则优先考虑客服的历史评分和当前排队量。页面上新增了一个一键提交按钮。"
      note: 标题是风险，内容是流程
    - state: "【章节标题】五、上线计划\n【章节内容】个性化推荐的核心是排序模型。模型使用商品的历史点击率、转化率和用户复购率三个特征，权重分别是 0.5、0.3、0.2。"
    - state: "【章节标题】二、背景\n【章节内容】本期需要研发 12 人天，测试 4 人天。前端和后端可以并行开发，联调安排在第二周。"
    - state: "【章节标题】四、数据指标\n【章节内容】我们和三家大客户的负责人开了会，大家对新版控制台都比较认可，也提出了一些改进意见，后续会持续沟通。"
    - state: "【章节标题】六、非目标\n【章节内容】本期会上线积分兑换、积分过期提醒和会员等级展示三个功能，预计 11 月中旬上线。"
      note: 标题说不做什么，内容说做什么
  negative:
    - state: "【章节标题】三、风险与应对\n【章节内容】主要风险是物流公司回传的轨迹数据不准确。应对：上线前两周和物流公司逐条核对接口字段，上线后每天抽检 100 单。"
    - state: "【章节标题】五、上线计划\n【章节内容】11 月 10 日灰度 3 个城市，11 月 17 日扩到 20 个城市，11 月 24 日全量。每一步前检查下单成功率不低于 95%。"
    - state: "【章节标题】二、背景\n【章节内容】目前退款全靠客服人工审核，平均每单 9.5 分钟，高峰期积压超过 200 单。用户反馈最多的是退货要联系三次客服。"
    - state: "【章节标题】七、其他\n【章节内容】本文档的原型图见蓝湖项目会员中心改版。"
      note: 概括性标题
    - state: "【章节标题】四、数据指标\n【章节内容】核心指标是工单平均处理时长，目标从 9.5 分钟降到 4 分钟。辅助指标是重复进线率和一次解决率。"
