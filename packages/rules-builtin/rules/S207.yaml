id: S207
version: 2
name: 结论没有依据
pass: 2
kind: judge
severity: warning
scope: block
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这段文字里是否有"因此""所以""由此可见""可以看出""综上"等引出结论的词，
    但在它前面（本段和【上一段】里）找不到能支撑这个结论的事实、数据或推理？
    只说做过什么、有什么现象，却没说出具体发现（"调研了几款竞品""反馈比较多""日活有所波动"），
    或者给出的事实即使成立也推不出这个结论，都算找不到支撑。
  criteria:
    "true": 结论前面没有给出任何支撑，或者给出的内容和结论毫无关系
    "false": 结论前面有支撑，或者段落里没有结论性的词
what: 用"因此""所以"引出结论，但前面找不到依据
not_for:
  - 结论前面给出了具体的理由，只是不够充分（论证强弱不归这条规则管）
  - 结论引用了明确指出的其他章节或数据来源，比如"根据第三节的数据"
  - 没有结论性的词

message: 这段用结论词引出了结论，但前面找不到支撑它的依据
suggestion: 在结论前补上依据（数据、事实或推理），或者去掉结论词。

examples:
  positive:
    - state: 当前退货流程涉及三个角色。因此，自动审核能把退款时间缩短一半以上。
      note: 三个角色推不出缩短一半
    - state: 我们调研了市面上的几款竞品。由此可见，用户最在意的是退货的便利性。
      note: 没说调研发现了什么
    - state: 商家后台的日活在上个月有所波动，所以本期应该优先做商家后台的消息提醒。
    - state: 综上所述，新方案在成本、效率和体验上都全面优于旧方案。
      note: 前面什么都没有
    - state: 商家反馈比较多。可以看出，现有的审核规则已经完全不适合业务发展。
  negative:
    - state: 过去三个月，62% 的退货申请要联系客服三次以上才能提交成功，而这类申请的差评率是其他申请的两倍。因此，本期优先把退货入口放进订单详情页。
    - state: "【上一段】A/B 测试显示，自动审核组的平均退款时长是 4.3 分钟，人工组是 9.5 分钟。\n【当前段落】所以自动审核能把退款时长缩短一半以上，建议全量上线。"
      note: 依据在上一段
    - state: 根据第三节的数据，常见问题工单占全部工单的 80%，因此机器人自动回复能覆盖绝大部分场景。
      note: 引用了其他章节
    - state: 两个方案的成本相同，但方案 B 不需要改动商家后台，所以我们选择方案 B。
    - state: 用户提交退货申请后，系统进入审核流程，审核通过后发送通知。
      note: 没有结论词
