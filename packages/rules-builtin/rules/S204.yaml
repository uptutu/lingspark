id: S204
version: 1
name: 空话套话
pass: 2
kind: judge
severity: warning
scope: block
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这段文字是否主要由空话套话构成：读完之后，读者得不到任何具体信息
    （谁、做什么、做到什么程度、什么时候、怎么衡量）？
    例如"全面提升""深度赋能""打造闭环""持续优化""构建生态"之类的词堆在一起，却没有落到具体的事情上。
  criteria:
    "true": 整段读完得不到任何可以执行或可以检验的信息
    "false": 段落里有具体的对象、做法、数字、时间或例子
what: 空话套话，没有信息量
not_for:
  - 有一句概括性的话，但紧接着给出了具体的数字、做法或例子
  - 文档开头或结尾用一两句话概括主题，后面的章节有展开
  - 引用领导讲话或原始需求的原话

message: 这段主要是空话套话，读者得不到具体信息
suggestion: 写清楚具体做什么、做到什么程度、怎么衡量；如果没有具体内容，删掉这段。

examples:
  positive:
    - state: 本项目将全面提升购物体验，深度赋能商家运营，打造高效协同的智能履约闭环。
    - state: 我们要以用户为中心，持续优化产品能力，不断提升服务质量，实现业务的高质量发展。
    - state: 通过数字化手段，赋能一线，降本增效，构建可持续的内容服务生态。
    - state: 下一阶段的工作重点是进一步夯实基础、补齐短板、形成合力，推动各项工作再上新台阶。
    - state: 新方案将从多个维度发力，全方位、多层次地提升推荐的精准度和效率。
  negative:
    - state: 本项目要把工单平均处理时长从 9.5 分钟降到 4 分钟，方法是让 80% 的常见问题由机器人自动回复，只有回复不了的才转人工。
    - state: 目标是提升退款体验。具体来说：申请提交后 10 分钟内给出结果，退货不需要再打电话联系客服。
      note: 概括后紧跟具体内容
    - state: 下一阶段先做两件事：补齐商品的库位数据，然后在三个仓库试点自动分拣。
    - state: 商家反馈最多的问题是修改发货地址要联系三次客服，本期把修改入口放进商家后台，一次提交完成。
    - state: 总的来说，这次改版的核心是减少人工审核。后面三节分别说明规则、流程和上线计划。
      note: 概括句，后文有展开
