id: D101
version: 2
name: 数值不一致
pass: 1
kind: deterministic
impl: numeric-consistency
severity: error
scope: document
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

message: '「{label}」在第 {line} 行是 {first}，这里是 {second}'
suggestion: 确认哪个取值是对的，然后统一全文。

examples:
  positive:
    - state: "日活目标是 50 万。\n\n经过评估，日活目标是 80 万。"
      note: 同一标签同一单位两个取值
    - state: "接口超时设为 30 秒。\n\n客户端侧，接口超时设为 60 秒。"
      note: 配置值前后不一致
    - state: "本期预算是 200 万元。\n\n合计预算是 200 万元，其中本期预算是 300 万元。"
      note: 第三处与前文冲突
    - state: "覆盖率要求是 80%。\n\n上线门槛：覆盖率要求是 90%。"
      note: 百分比不一致
    - state: "| 指标 | 现状 |\n|---|---|\n| 日活 | 50 万 |\n\n| 指标 | 现状 |\n|---|---|\n| 日活 | 80 万 |"
      note: 同一节里两张同表头的表，同一个「行头·列头」取值不同
    - state: "## 一、背景\n\n日活目标是 50 万。\n\n## 三、方案\n\n本方案的日活目标是 80 万。"
      note: 跨章节的全文级事实（复合名词标签）前后矛盾
    - state: "本季度日活目标是 50 万。\n经过评估，本季度日活目标是 80 万。"
      note: 一句一行、中间没空行，Markdown 算同一段，但以句号结尾的行各自成句（Agent 常这样写）
    - state: "接口超时设为 30 秒。\n\n接口超时设为 1 分钟。"
      note: 单位可换算（L2）：30 秒与 1 分钟不同，仍报
    - state: "存量是 3 万。\n\n存量是 40,000 元。"
      note: 万与元同族（L2），换算后不等，报
    - state: "缓存上限是 512 MB。\n\n缓存上限是 1 GB。"
      note: 容量单位同族（L2），换算后不等，报
  negative:
    - state: "日活从 50 万提升到 80 万。"
      note: 同一句里描述变化，不是矛盾
    - state: "日活目标是 80 万。\n\n次日留存目标是 38%。"
      note: 标签不同
    - state: "| 指标 | 现状 | 目标 |\n|---|---|---|\n| 日活 | 50 万 | 80 万 |"
      note: 现状与目标是不同的列头，因此是不同的标签
    - state: "日活同比增长 20%，环比增长 5%。"
      note: 同比环比是对比语境
    - state: "日活目标是 50 万。\n\n日活目标是 50 万。"
      note: 取值相同，只是重复
    - state: "版本号是 v1.2.3，端口是 8080。"
      note: 不同标签，且没有单位
    - state: "Pass 1 是确定性规则。\n\nPass 0 负责解析。\n\nPass 2 是段落级语义。"
      note: 数字是名字的一部分，没有单位，不是度量（真实文档里出现过的写法）
    - state: "本期投入 3 个人。\n\n下期投入 5 个人。"
      note: 标签不同（本期投入 / 下期投入）
    - state: "### 2.1 华东仓\n\n- 租金：4 万元人民币。\n\n### 2.3 华南仓\n\n- 租金：12 万元人民币。"
      note: 两字泛称标签在不同章节，是各自主体的属性（真实文档里出现过的写法）
    - state: "| 情景 | 转化率 | 月利润 |\n|---|---|---|\n| 全年 | 2% | 18 万元 |\n| 全年 | 5% | 64 万元 |"
      note: 首列有重复值的多维表，是敏感性分析（真实文档里出现过的写法）
    - state: "客服主管的月薪为 1.8 万元，质检专员的月薪为 1.2 万元，培训师的月薪为 1.5 万元。"
      note: 同一段里的枚举（真实文档里出现过的写法）
    - state: "客服主管的月薪为 1.8 万元，\n质检专员的月薪为 1.2 万元，\n培训师的月薪为 1.5 万元。"
      note: 折行的枚举：行尾是逗号，仍是同一句
    - state: "首期采购预算约 40 万—55 万元。\n\n全年预算约 200 万—260 万元。"
      note: 区间的两端不是独立取值（真实文档里出现过的写法）
    - state: "第 1 节预计阅读时长：80 秒。\n\n第 2 节预计阅读时长：60 秒。\n\n第 3 节预计阅读时长：150 秒。"
      note: 每条记录都有的重复字段（真实文档里出现过的写法）
    - state: "预算是 50 万元。\n\n预算是 500,000 元。"
      note: 单位可换算且换算后相等（L2），不报
    - state: "标价是 100 美元。\n\n标价是 100 元。"
      note: 不同币种不同族（L2），不报
    - state: "转化率是 20%。\n\n转化率是 200‰。"
      note: 百分比与千分比同族且相等（L2），不报
