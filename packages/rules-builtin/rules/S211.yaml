id: S211
version: 1
name: 章节与前言冲突
pass: 2
kind: judge
severity: warning
scope: section-cross
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这个章节的内容，是否与【前文】里已经确定的说法冲突？例如前文定了范围、日期、预算、
    技术选型，本章的安排或说法与这些既定事实对不上。前文视为已确认的事实，只判断本章
    是否与之矛盾。
  criteria:
    "true": 本章的说法与前文确定的事实不能同时成立
    "false": 本章是对前文的展开、细化或一致的重述；或者本章明确交代了变更原因
what: 章节内容与前面章节确定的说法冲突
not_for:
  - 本章是对前文的细化、展开或一致的重述
  - 明确交代的变更，比如"经评审，原定的日期改为……"并说明了原因
  - 前文本身就没有把话说定（"初步考虑""可能在"）

message: 本章与前面章节的说法冲突，不能同时成立
suggestion: 确认哪个说法是对的；如果是有意变更，在本章写明变更原因并同步修改前文。

examples:
  positive:
    - state: "【前文】## 范围\n本期只做 Web 端，不做移动端。\n【章节标题】\n发布计划\n【章节内容】\nApp 商店审核通过后，iOS 版本随本期一同上线。"
      note: 前文定了不做移动端，本章安排 iOS 上线
    - state: "【前文】## 预算\n总预算是 200 万元，不可超支。\n【章节标题】\n费用明细\n【章节内容】\n人力、推广和运维三项加起来一共是 260 万元。"
      note: 前文定了预算上限，本章明细超出
    - state: "【前文】## 排期\n上线日期定在 11 月 15 日。\n【章节标题】\n里程碑\n【章节内容】\n12 月 1 日全量上线，此前完成两轮内测。"
      note: 前文定了上线日期，本章改期且未交代变更
    - state: "【前文】## 技术选型\n数据存储统一使用 PostgreSQL。\n【章节标题】\n数据架构\n【章节内容】\n用户行为日志量太大，单独写入 ClickHouse 集群。"
      note: 前文定了统一 PostgreSQL，本章引入另一套存储
    - state: "【前文】## 需求边界\n本期不支持离线使用。\n【章节标题】\n弱网方案\n【章节内容】\n网络断开时自动进入离线模式，恢复后自动同步。"
      note: 前文定了不做离线，本章实现了离线模式
  negative:
    - state: "【前文】## 背景\n客服接到的收货地址修改请求每天约三百个。\n【章节标题】\n现状分析\n【章节内容】\n这三百个请求里，八成以上需要人工重复核对，是客服的主要耗时来源。"
      note: 本章是对前文数字的细化展开，一致
    - state: "【前文】## 目标\n本期目标是日活 50 万。\n【章节标题】\n运营计划\n【章节内容】\n为了达成日活 50 万的目标，投放预算向新用户渠道倾斜。"
      note: 一致的重述
    - state: "【前文】## 排期\n上线日期定在 11 月 15 日。\n【章节标题】\n里程碑\n【章节内容】\n经评审，双十一期间冻结发版，上线日期改为 11 月 20 日。"
      note: 明确交代的变更及原因
    - state: "【前文】## 团队\n项目组一共 6 名工程师。\n【章节标题】\n分工\n【章节内容】\n其中 4 人负责后端接口，2 人负责前端页面。"
      note: 前文数字的细化分解，加起来一致
    - state: "【前文】## 背景\n初步考虑用现成的报表组件，具体方案待定。\n【章节标题】\n技术方案\n【章节内容】\n最终选用自研报表模块，因为现成的组件不支持合并单元格。"
      note: 前文没有说定，本章给出结论不算冲突
