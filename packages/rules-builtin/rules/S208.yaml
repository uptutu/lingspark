id: S208
version: 1
name: AI 腔修辞
pass: 2
kind: judge
severity: info
scope: block
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这段文字是否带有明显的 AI 写作腔？典型表现：刻意的"不是……而是……"对比；
    为了凑三而写的三连排比；自问自答（"那么，这意味着什么呢？"）；
    空泛的升华句（"这不仅是……更是……"）；用口号式的金句收尾。
  criteria:
    "true": 有上述表现之一，而且去掉它不损失任何信息
    "false": 表达朴素，每句话都在传递信息
what: AI 写作腔：刻意对比、凑数排比、自问自答、空泛升华
not_for:
  - 只出现一次、而且确实在澄清一个常见误解的"不是……而是……"
  - 三项列举是因为事实上正好有三项
  - 引用的原话

message: 这段有明显的 AI 写作腔，修辞多于信息
suggestion: 删掉修辞，直接说事实和结论。

examples:
  positive:
    - state: 这不仅仅是一次功能升级，更是一次服务理念的深刻变革。
    - state: 那么，这意味着什么呢？这意味着，对账将不再是负担，而是一种享受。
    - state: 我们要做的不是简单地替代人工，而是重新定义人和系统的协作方式。
    - state: 更快的搜索、更准的推荐、更好的体验——这就是我们的承诺。
    - state: 效率、体验、增长，三者缺一不可。归根结底，一切都是为了用户。
  negative:
    - state: 机器人只处理常见问题，退款纠纷和投诉仍由人工客服处理。
    - state: 这次改动不涉及计费规则，只调整了下单入口的位置。
    - state: 买家端、商家端、管理后台都需要改动，工作量分别是 5、3、2 人天。
      note: 事实上正好三项
    - state: 常有人以为机器人客服会取代人工客服，实际上人工客服会转去处理复杂工单和投诉。
      note: 澄清一个真实的误解
    - state: 上线后我们会观察两周，重点看工单处理时长和重复进线次数这两个指标。
