id: S202
version: 1
name: 句子成分残缺导致歧义
pass: 2
kind: judge
severity: warning
scope: block
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这段文字里是否有句子因为缺少主语、宾语或其他关键成分，导致读者无法确定
    是谁做了什么、对什么做了什么？
  criteria:
    "true": 至少有一句话缺了关键成分，而且读者从上下文补不出来，意思因此不确定
    "false": 句子成分完整，或者省略的部分能从上下文明确补出
what: 缺少关键成分，导致"谁""做什么""对什么"无法确定
not_for:
  - 列表项、标题式短语、表格里的简写，本来就不是完整句子
  - 主语承前省略，读者能从上一句明确补出来
  - 口语化但意思清楚的省略

message: 这段有句子缺了关键成分，读者无法确定是谁做了什么
suggestion: 补上缺失的主语或宾语，写明是谁、对什么、做了什么。

examples:
  positive:
    - state: 由于接口调整，导致部分用户无法登录，已经处理。
      note: "\"由于……导致\"吃掉了主语；\"已经处理\"不知道谁处理了什么"
    - state: 经过评审后，决定暂缓，等数据出来再定。
      note: 暂缓什么、谁决定的都不清楚
    - state: 对于商家后台的改动，在上线前需要完成，否则影响。
      note: 影响什么没有说
    - state: 为了提升搜索准确率，把规则进行了调整，但还没有。
      note: "\"还没有\"缺了宾语"
    - state: 在客服系统上线新的工单入口以后，通过灰度，覆盖。
      note: 谁通过灰度覆盖什么都不清楚
  negative:
    - state: 我们分析了过去三个月的搜索日志，发现三个问题需要在下个版本解决。
      note: 成分完整
    - state: 接口调整导致部分用户无法登录，后端团队已在 9 月 15 日修复。
      note: 成分完整
    - state: 用户提交退货申请后，系统自动审核，审核通过即发送通知。
      note: 省略的主语能明确补出
    - state: 商家后台改动：上线前完成联调。
      note: 标题式简写
    - state: 这次改版的目标很明确：减少人工审核，缩短退款时间。
      note: 成分完整
