id: S206
version: 2
name: 主语或话题中途偷换
pass: 2
kind: judge
severity: warning
scope: block
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这段文字是否在中途不加说明地换了动作的执行者？中文常省略主语，读者会默认
    后面的动作还是前面那个主语做的。如果按这个默认读，某个动作会被安到错误的人或系统头上
    （例如前半句说"后端服务生成结果"，后半句"点击确认按钮"实际是用户做的，却没写出用户），就算。
    不要因为"省略主语在中文里很常见"而放过：要看按字面读，动作归属是否错了。
  criteria:
    "true": 有一处动作的执行者悄悄换了人，按字面读会得出错误的理解
    "false": 每个动作是谁做的都清楚
what: 主语或话题悄悄换了，读者会以为还是同一个对象
not_for:
  - 用"而""另一方面""与此同时"等词明确标出了转换
  - 用分号或句号隔开，每句的主语都写明了
  - 列举多个对象各自的情况

message: 这段中途换了主语，但没有写明，读者会误以为还是同一个对象
suggestion: 在换了执行者的地方写明主语。

examples:
  positive:
    - state: 买家在订单页提交退货申请并寄回商品，收到商品后确认无误就原路退款。
      note: 收货和退款的是商家
    - state: 运营在后台配置满减活动，配置完成后下单时就会自动抵扣。
      note: 下单的是消费者
    - state: 商家在后台设置可配送时段，设置后在 App 里就能直接选择送达时间。
      note: 选择送达时间的是买家
    - state: 财务收到报销单后，核对发票金额，审核通过后三个工作日内就能收到报销款。
      note: 收到报销款的不是财务
    - state: 后端服务负责计算运费，结果出来后点击确认按钮即可提交订单。
      note: 点击的是用户
  negative:
    - state: 买家提交退货申请；商家收到通知后确认是否同意退货。
    - state: 运营在后台配置满减规则，而消费者只会看到规则执行后的价格。
      note: "\"而\"标出了转换"
    - state: 财务收到报销单后，核对发票金额并回复申请人。
    - state: 商家设置可配送时段后，买家就能在 App 里看到这些时段并直接选择。
    - state: 买家、商家和平台各有一个入口：买家提交订单，商家确认发货，平台查看报表。
      note: 列举各自的动作
