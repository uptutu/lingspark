id: S201
version: 1
name: 指代不明
pass: 2
kind: judge
severity: warning
scope: block
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这段文字里是否存在指代不明的代词或指示词：读者无法根据上文唯一确定
    "它""其""该""这个""这些""上述""前者""后者""他""她"等词指的是什么？
  criteria:
    "true": 至少有一处代词或指示词，上文中有两个以上合理的指代对象，或者根本找不到指代对象
    "false": 所有代词和指示词都能从上文唯一确定所指，或者段落里没有这类词
what: 代词或指示词有多个可能的指代对象，或者没有指代对象
not_for:
  - 指代对象就在同一句或紧邻的上一句，而且只有一个候选
  - "\"这意味着\"\"这样一来\"\"这一点\"等指代前面整句话的泛指用法"
  - "\"该页面\"\"该接口\"紧跟在唯一一个页面或接口的介绍之后"
  - "\"前者\"\"后者\"前面恰好只列了两项"

message: 这段有代词或指示词指代不明，读者无法确定它指的是什么
suggestion: 把代词换成它所指的具体名词。

examples:
  positive:
    - state: 推荐系统和召回服务都要在本期改造，它的延迟目前是 200 毫秒，需要降到 100 毫秒以内。
      note: 两个服务都可能是"它"
    - state: "【上一段】买家端和商家端都会展示退款结果。\n【当前段落】它需要在退款到账后 5 秒内刷新。"
      note: 上一段有两个端，"它"无法确定
    - state: 张经理和李主管讨论后决定由他负责跟进上线。
      note: "\"他\"有两个候选"
    - state: 订单服务同时调用库存服务和支付服务，如果它超时，整个下单流程都会失败。
      note: 三个服务都可能超时
    - state: 上述两个方案中，它的实施周期更短，建议优先采用。
      note: "\"它\"在两个方案之间无法确定"
  negative:
    - state: 召回服务目前的延迟是 200 毫秒，它需要在本期降到 100 毫秒以内。
      note: 只有一个候选
    - state: 我们决定下线旧版结算入口。这意味着所有用户都要走新流程。
      note: "\"这意味着\"指代整句话"
    - state: 新版审批流配置页面支持拖拽调整节点顺序。该页面同时保留原有的列表视图，方便老用户过渡。
      note: "\"该页面\"紧跟唯一的页面介绍"
    - state: 本期不支持离线使用，原因是离线同步会引入冲突合并的复杂度，而这部分工作量超出了两周的开发周期。
      note: "\"这部分\"所指明确"
    - state: 方案 A 成本低但风险高，方案 B 成本高但风险低，前者适合试点，后者适合全面推广。
      note: 前者后者恰好对应两项
    - state: 员工提交报销单后，系统会通知直属主管和财务；主管收到通知后可以选择通过或驳回，财务可以看到报销明细。
      note: 长段落但没有代词
