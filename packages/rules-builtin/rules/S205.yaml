id: S205
version: 1
name: 段落内自相矛盾
pass: 2
kind: judge
severity: error
scope: block
doc_types: [prd, tech-design, report, generic]
status: active
origin: builtin

question:
  type: noul
  instructions: >-
    这段文字内部是否自相矛盾：有两处说法不能同时成立？例如前面说不做、后面又安排了；
    前面说全部、后面又说一部分例外却没有交代；同一件事给出了互斥的条件或日期。
  criteria:
    "true": 段落里有两个说法不可能同时为真
    "false": 段落里的说法能够同时成立
what: 同一段里的两个说法不能同时成立
not_for:
  - 描述变化或对比，比如"从……到……""原来……现在……"
  - "\"原则上……，例外是……\"这种明确交代了例外的写法"
  - 列举不同对象各自的情况
  - 描述争议或不同方的观点，并说明了尚未定论

message: 这段前后说法矛盾，不能同时成立
suggestion: 确认哪个说法是对的，删掉或改正另一个；如果是有例外，把例外写明。

examples:
  positive:
    - state: 本期不支持离线使用。为了保证弱网体验，本期会实现离线缓存和断网重连后的自动同步。
      note: 不支持离线 vs 实现离线缓存
    - state: 所有退款申请都会自动审核，无需人工介入；审核失败的申请由客服人工处理。
      note: 无需人工介入 vs 人工处理
    - state: 这个功能只对超级管理员开放。普通成员也可以在自己的控制台里使用该功能修改权限配置。
    - state: 上线时间定在 11 月 15 日。由于要等双十一之后的发版窗口，最早只能在 11 月 20 日上线。
    - state: 我们决定保留旧的下单入口，新旧两套流程并行；上线当天旧入口会下线，所有流量切到新流程。
  negative:
    - state: 原来修改收货地址需要打三次客服电话，新流程里用户在 App 里一次提交就能完成。
      note: 变化，不是矛盾
    - state: 原则上所有退款申请都自动审核；例外是跨境订单和金额超过 5000 元的申请，这两类转人工。
      note: 明确交代了例外
    - state: 超级管理员可以修改所有成员的权限；普通成员只能修改自己创建、而且还没发布的配置。
      note: 不同对象各自的权限
    - state: 产品建议 11 月 15 日上线，研发认为 11 月 20 日更稳妥，最终日期在周五评审会上定。
      note: 不同方的观点，未定论
    - state: 本期不做离线使用。弱网下的体验通过缩短请求超时和增加重试来改善。
      note: 两句话能同时成立
