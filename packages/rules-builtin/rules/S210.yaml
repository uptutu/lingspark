id: S210
version: 1
name: 同一指标换说法后数值对不上
pass: 2
kind: judge
severity: info
scope: block
doc_types: [prd, tech-design, report, generic]
status: shadow
origin: builtin

question:
  type: noul
  instructions: >-
    这段文字里，两个措辞不同（但指的是同一个指标、同一个配置项或同一个限制）的数值说法，
    给出的数值是否对不上？例如"接口超时 30 秒"和"等待响应最长 45 秒"说的是同一件事但数值不同；
    "日活 50 万"和"DAU 80 万"说的是同一个指标但数值不同。这是 D101（数值不一致）的 L3
    语义对齐层：机械比较抓不到换了一种说法的同一指标，交给语义判断。
  criteria:
    "true": 两个不同措辞说的是同一个指标/配置/限制，但给出的数值不同
    "false": 措辞不同但数值一致；或者两个说法本来指的就是不同的指标
what: 同一指标换了说法后，前后数值对不上
not_for:
  - 描述变化或换算关系，比如"从 50 万提升到 80 万""100 美元，约合人民币 700 元"
  - 同一段里的枚举，不同对象各自有不同的数值
  - 两个数值本来就属于不同指标（超时和重试间隔、容量和并发数）

message: 这段里同一指标换了说法，数值对不上（{first} vs {second}）
suggestion: 确认这个指标的正确取值，把两种说法统一。

examples:
  positive:
    - state: 峰值 QPS 预计为 2000，而系统的每秒请求处理能力按 3000 设计。
      note: 峰值 QPS 与每秒请求处理能力是同一件事，数值不同
    - state: 接口超时设为 30 秒，调用方等待响应的最长时间是 45 秒。
      note: 接口超时与等待响应最长时间是同一限制，数值不同
    - state: 缓存容量上限为 1 GB，内存池可占用的最大空间是 512 MB。
      note: 缓存上限与内存池最大空间是同一限制，换算后不等
    - state: 本季度目标是日活 50 万，DAU 峰值预期达到 80 万。
      note: 日活与 DAU 是同一指标，数值不同
    - state: 单次上传限制为 10 MB，文件大小不得超过 20 MB。
      note: 上传限制与文件大小上限是同一限制，数值不同
  negative:
    - state: 日活从 50 万提升到 80 万。
      note: 描述变化，不是矛盾
    - state: 接口超时设为 30 秒，重试间隔是 5 秒。
      note: 超时与重试间隔是不同指标
    - state: 峰值 QPS 是 2000，每秒请求处理能力也是 2000。
      note: 同一指标但数值一致
    - state: 客服主管的月薪为 1.8 万元，质检专员的月薪为 1.2 万元。
      note: 不同对象各自的数值
    - state: 定价是 100 美元，约合人民币 700 元。
      note: 换算关系，两个数值同时成立
